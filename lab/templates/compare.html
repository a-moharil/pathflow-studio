{% extends 'base.html' %}{% block content %}<p class="eyebrow">EXPERIMENT COMPARISON</p><h1>Learning histories</h1><div id="comparison" class="chart tall"></div><div id="runList"></div><p class="help">Each curve is labelled with its dataset, optimizer and seed. Comparing different datasets does not constitute a controlled optimizer comparison.</p>{% endblock %}{% block scripts %}<script>(async()=>{let traces=[];for(let r of await api('/api/runs')){let d=await api('/api/run/'+r.id);traces.push({x:d.metrics.map(m=>m.step),y:d.metrics.map(m=>m.val_loss),type:'scatter',mode:'lines+markers',name:`${r.config.name} · ${r.config.dataset} · ${r.config.optimizer} · seed ${r.config.seed}`})}Charts.render('comparison',traces,{xaxis:{title:'Optimizer update'},yaxis:{title:'Validation cross-entropy'}})})().catch(showError)</script>{% endblock %}
