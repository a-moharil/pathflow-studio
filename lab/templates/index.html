{% extends 'base.html' %}{% block content %}<div class="titleRow"><div><p class="eyebrow">EXPERIMENT REGISTRY</p><h1>Experiments</h1><p>Training histories, intrinsic measurements and interventions.</p></div><a class="button primary" href="/design">New experiment</a></div><section class="card"><label>Search experiments <input id="search" placeholder="Name, dataset, architecture or optimizer"></label><div id="experiments" class="tableWrap"></div></section>{% endblock %}{% block scripts %}<script>
let registry=[];function renderRegistry(){let table=document.createElement('table');table.innerHTML='<thead><tr><th>Experiment</th><th>Dataset</th><th>Model / optimizer</th><th>Status</th><th>Update</th><th>Actions</th></tr></thead>';let body=document.createElement('tbody');for(let r of registry.filter(r=>JSON.stringify(r.config).toLowerCase().includes($('search').value.toLowerCase()))){let tr=document.createElement('tr');for(let value of [r.config.name,r.config.dataset,r.config.model.toUpperCase()+' / '+r.config.optimizer,r.status,r.step]){let td=document.createElement('td');td.textContent=value;tr.append(td)}let td=document.createElement('td'),a=document.createElement('a'),button=document.createElement('button');a.href='/experiment/'+r.id;a.textContent='Open';button.textContent=r.status==='delete_failed'?'Retry deletion':'Delete';button.className='danger';button.disabled=r.status==='delete_requested';button.onclick=()=>deleteExperiment(r.id);td.append(a,document.createTextNode('  '),button);if(r.error){let note=document.createElement('details'),sum=document.createElement('summary'),pre=document.createElement('pre');sum.textContent='Error details';pre.textContent=r.error;note.append(sum,pre);td.append(note)}tr.append(td);body.append(tr)}table.append(body);$('experiments').replaceChildren(table);if(!registry.length)$('experiments').append('No experiments yet. Create an experiment to begin.')}
async function refreshRegistry(){try{registry=await api('/api/runs');renderRegistry()}catch(e){showError(e)}}$('search').oninput=renderRegistry;refreshRegistry();setInterval(refreshRegistry,3000);
</script>{% endblock %}
